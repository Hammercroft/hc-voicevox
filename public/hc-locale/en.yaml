name_attribute.x: exampleattr

# ============================================================
# CHARACTER DATA
#
# The strings here are not accessed via t().
# Instead, use these functions:
# - getLocalizedCharacterName
# - getLocalizedCharacterStyleName
# - getLocalizedGenericStyleName
# ============================================================

# NOTE as of now, all the enumerated styles are ones that are usable on the SING interface.

character_data:
    __generic__:
        localized_name: ~
        localized_style_names:
            "ノーマル": "Regular"
            "あまあま": "Sweet"
            "ツンツン": "Cold" # "tsun-tsun", Tsundere type
            "セクシー": "Alluring" # "sexy"
            "ささやき": "Whisper" # on-your-ear type whispering
            "囁き": "Whisper" # ditto
            "内緒話": "Whisper" # ditto
            "ヒソヒソ": "Hushed" # lowered-voice / murmuring / gossip
            "ヘロヘロ": "Tired"
            "なみだめ": "Tearful"
            "びえーん": "Tearful" 
            "喜び": "Delighted" # tone of gratefulness
            "おちつき": "Calm"
    波音リツ:
        localized_name: "Namine Ritsu"
        localized_style_names: # due to how style labels are handled, there are two of what would become her "Regular" styles and we currently have no way to distinguish them...
            "クイーン": "Queen"
    雀松朱司:
        localized_name: "Wakamatsu Akashi"
        localized_style_names: {} # no styles at all
    四国めたん:
        localized_name: "Shikoku Metan" 
        localized_style_names: {} # all covered by the generic style names
    ずんだもん:
